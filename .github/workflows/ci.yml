name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  salty-web:
    name: Salty site (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salty/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salty/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

  salty-video:
    name: Salty video generator (lint, types, clip list)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salty/video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: salty/video/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Every job named in content/videos.json must exist in the pay data with the figures its clip needs.
      - run: npm run make -- --list
